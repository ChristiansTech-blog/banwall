name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Wochentlich, damit ein Bruch durch neue shellcheck- oder Debian-
  # Versionen auffällt, auch wenn niemand etwas commitet.
  schedule:
    - cron: '0 5 * * 1'

# Nur der neueste Lauf pro Branch - spart Runner-Minuten bei schnellen
# Folge-Pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Version protokollieren
        run: shellcheck --version

      # --severity=style ist die schärfste Stufe. Für ein Tool, das als
      # root Firewall und sshd anfasst, ist das angemessen: die meisten
      # style-Hinweise von shellcheck sind Quoting-Probleme, und ein
      # ungequotetes Wort ist hier eine Sicherheitslücke, kein Schönheits-
      # fehler. -x folgt den source-Direktiven in die Module.
      - name: shellcheck
        run: |
          shellcheck --severity=style --external-sources --format=gcc \
            bin/banwall install.sh lib/banwall/*.sh tests/integration/run.sh

  syntax:
    name: Syntax-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # bash -n fängt, was shellcheck durchgehen lässt - etwa ein
      # unabgeschlossenes heredoc in einer render()-Funktion.
      - name: bash -n
        run: |
          fehler=0
          while IFS= read -r f; do
            if bash -n "$f"; then
              echo "ok      $f"
            else
              echo "FEHLER  $f"
              fehler=1
            fi
          done < <(git ls-files '*.sh' 'bin/*' 'tests/stubs/*')
          exit "$fehler"

      - name: Ausführbare Bits prüfen
        run: |
          for f in bin/banwall install.sh tests/integration/run.sh tests/stubs/*; do
            test -x "$f" || { echo "FEHLER: $f ist nicht ausführbar"; exit 1; }
          done
          echo "Alle Einstiegspunkte sind ausführbar."

  nftables:
    name: nftables-Regelwerk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nftables installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables

      # Das erzeugte Regelwerk wird gegen den echten Parser gehalten. Ein
      # Syntaxfehler würde auf dem Zielserver bedeuten, dass
      # nftables.service beim Boot scheitert - Server ohne Firewall.
      - name: Regelwerk erzeugen und prüfen
        run: |
          set -euo pipefail
          export BANWALL_SHARE_DIR="$PWD/share"
          source lib/banwall/common.sh
          source lib/banwall/config.sh
          source lib/banwall/nftables.sh

          check_ruleset() {
            echo "--- Variante: $1"
            banwall_nftables_render > /tmp/rules.nft
            sudo nft --check --file /tmp/rules.nft
          }

          BANWALL_TCP_PORTS="22"; check_ruleset "nur SSH"

          BANWALL_TCP_PORTS="22 80 443"
          BANWALL_UDP_PORTS="51820"
          BANWALL_ALLOW_NETS="203.0.113.0/24"
          check_ruleset "Webserver mit WireGuard und Admin-Netz"

          BANWALL_ALLOW_PING=0
          BANWALL_SSH_RATE_LIMIT=0
          check_ruleset "ohne Ping und Rate-Limit"
        shell: bash

  unit:
    name: Unit-Tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Abhängigkeiten
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends bats git ca-certificates nftables

      - uses: actions/checkout@v4

      # Auf Debian 13 getestet, weil das die Zielplattform ist: bash,
      # coreutils und nft verhalten sich dort anders als auf dem
      # Ubuntu-Runner.
      - name: bats
        run: bats --print-output-on-failure tests/unit
